name: "Hermes & FreeLLM Core"
version: "1.0.0"
slug: "hermes_freellm_core"
description: "Kombinierte App: LiteLLM Gateway (Free APIs) + Hermes Agent mit Git & Workspaces."
url: "https://github.com/amiralbert/HA-App-OmniHermes-AI-Core"
maintainer: "Amir Alexander Albert <amir.a.albert@gmail.com>"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: "application"
init: false
boot: "auto"
host_network: false
apparmor: true
ports:
  9119/tcp: 9119
  8000/tcp: 8000
ports_description:
  9119/tcp: "Hermes Dashboard"
  8000/tcp: "LiteLLM Gateway"
options:
  start_mode: "dashboard"
  default_model: "groq/llama-3.3-70b-versatile"
  groq_api_key: ""
  gemini_api_key: ""
  github_token: ""
  git_username: ""
  git_email: ""
  git_token: ""
  hermes_workspaces: "Projekt_A, Projekt_B"
  hermes_password: "admin"
schema:
  start_mode: "list(dashboard|gateway)"
  default_model: "str"
  groq_api_key: "password?"
  gemini_api_key: "password?"
  github_token: "password?"
  git_username: "str?"
  git_email: "str?"
  git_token: "password?"
  hermes_workspaces: "str?"
  hermes_password: "str"
environment: {}
map:
  - "config:rw"
  - "share:rw"
  - "addons:rw"
panel_icon: "mdi:robot-outline"
panel_title: "Hermes & FreeLLM"
panel_admin: false